name: NEXORA Robot

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "robot/**"
      - ".github/workflows/nexora-robot.yml"

permissions:
  contents: write

jobs:
  run-nexora-robot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar NEXORA Robot
        run: python robot/nexora_robot.py

      - name: Verificar arquivo NEXORA Deals
        run: |
          if [ -f robot/nexora_deals.json ]; then
            echo "nexora_deals.json criado com sucesso"
            ls -lh robot/nexora_deals.json
          else
            echo "ERRO: nexora_deals.json nao foi criado"
            exit 1
          fi

      - name: Salvar NEXORA Deals no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add robot/nexora_deals.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no nexora_deals.json"
          else
            git commit -m "Atualiza NEXORA Deals automaticamente [skip ci]"
            git push
          fi

      - name: Salvar NEXORA Deals como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nexora-deals
          path: robot/nexora_deals.json
          retention-days: 7
